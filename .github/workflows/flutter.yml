name: Flutter multiplatform

on:
  push:
    paths:
      - 'flutter_app/**'
      - 'worker/**'
      - 'scripts/flutter-server.mjs'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'flutter_app/**'
      - 'worker/**'
      - 'scripts/flutter-server.mjs'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: flutter_app

env:
  FLUTTER_VERSION: '3.35.7'
  APP_VERSION: '1.0.0+1'

jobs:
  analyze-test-web:
    name: Analyze, tests and Web
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Live API tests remain skipped without the explicit Dart define.
      - run: flutter test
      - run: flutter build web --release
      - name: Upload Web bundle
        uses: actions/upload-artifact@v4
        with:
          name: langpack-web-${{ env.APP_VERSION }}
          path: flutter_app/build/web/
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android debug
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android build SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: langpack-android-debug-${{ env.APP_VERSION }}
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  apple:
    name: iOS simulator and macOS debug
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --debug --no-codesign
      - name: Package iOS simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app "build/langpack-ios-simulator-$APP_VERSION.zip"
      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: langpack-ios-simulator-${{ env.APP_VERSION }}
          path: flutter_app/build/langpack-ios-simulator-${{ env.APP_VERSION }}.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - run: flutter build macos --debug
      - name: Package macOS debug app
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Debug/LangPack.app "build/langpack-macos-debug-$APP_VERSION.zip"
      - name: Upload macOS debug app
        uses: actions/upload-artifact@v4
        with:
          name: langpack-macos-debug-${{ env.APP_VERSION }}
          path: flutter_app/build/langpack-macos-debug-${{ env.APP_VERSION }}.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows:
    name: Windows release build
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Upload complete Windows runtime
        uses: actions/upload-artifact@v4
        with:
          name: langpack-windows-release-${{ env.APP_VERSION }}
          path: |
            flutter_app/build/windows/x64/runner/Release/
            !flutter_app/build/windows/x64/runner/Release/**/*.pdb
            !flutter_app/build/windows/x64/runner/Release/**/*.symbols
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux release build
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      # Tar retains executable bits and symlinks that artifact ZIPs do not retain.
      - name: Package Linux runtime
        run: tar -czf "build/langpack-linux-release-$APP_VERSION.tar.gz" -C build/linux/x64/release bundle
      - name: Upload Linux runtime
        uses: actions/upload-artifact@v4
        with:
          name: langpack-linux-release-${{ env.APP_VERSION }}
          path: flutter_app/build/langpack-linux-release-${{ env.APP_VERSION }}.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
