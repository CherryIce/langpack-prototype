name: Manual packages and release
run-name: Manual packages · ${{ github.ref_name }} · ${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: '打包 Android APK（可安装调试包）'
        type: boolean
        default: true
      build_web:
        description: '打包 Web（Release）'
        type: boolean
        default: false
      build_macos:
        description: '打包 macOS（Release，未公证）'
        type: boolean
        default: false
      build_windows:
        description: '打包 Windows（Release，完整运行目录）'
        type: boolean
        default: false
      publish_release:
        description: '全部所选平台成功后，发布到 GitHub Releases'
        type: boolean
        default: false
      release_tag:
        description: '发布版本标签（勾选发布时必填，例如 v1.0.0）'
        type: string
        default: ''

permissions:
  contents: read

defaults:
  run:
    working-directory: flutter_app

env:
  FLUTTER_VERSION: '3.35.7'
  BUILD_ID: ${{ github.run_number }}-${{ github.run_attempt }}
  BUILD_APK: ${{ inputs.build_apk }}
  BUILD_WEB: ${{ inputs.build_web }}
  BUILD_MACOS: ${{ inputs.build_macos }}
  BUILD_WINDOWS: ${{ inputs.build_windows }}
  PUBLISH_RELEASE: ${{ inputs.publish_release }}
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  validate:
    name: Validate selection and Flutter checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate selection and release tag
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/manual-packages.mjs validate
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # No production credentials or live-test defines are passed to this job.
      - run: flutter test
      - name: Validate packaging helper
        working-directory: ${{ github.workspace }}
        run: node --test tests/manual-packages.test.mjs

  apk:
    name: Android APK (debug)
    needs: validate
    if: ${{ inputs.build_apk }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - name: Prepare APK
        run: |
          mkdir -p build/packages
          cp build/app/outputs/flutter-apk/app-debug.apk "build/packages/langpack-apk-debug-${BUILD_ID}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: langpack-apk-${{ env.BUILD_ID }}
          path: flutter_app/build/packages/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  web:
    name: Web (release)
    needs: validate
    if: ${{ inputs.build_web }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - name: Package Web
        run: |
          mkdir -p build/packages
          cd build/web
          zip -q -r "../packages/langpack-web-release-${BUILD_ID}.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: langpack-web-${{ env.BUILD_ID }}
          path: flutter_app/build/packages/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  macos:
    name: macOS (release)
    needs: validate
    if: ${{ inputs.build_macos }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package macOS app
        run: |
          mkdir -p build/packages
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/LangPack.app "build/packages/langpack-macos-release-${BUILD_ID}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: langpack-macos-${{ env.BUILD_ID }}
          path: flutter_app/build/packages/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows:
    name: Windows (release)
    needs: validate
    if: ${{ inputs.build_windows }}
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package complete Windows runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/packages | Out-Null
          $runtime = Get-ChildItem -LiteralPath build/windows/x64/runner/Release | Where-Object { $_.Extension -notin '.pdb', '.symbols' }
          Compress-Archive -Path $runtime.FullName -DestinationPath "build/packages/langpack-windows-release-$env:BUILD_ID.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: langpack-windows-${{ env.BUILD_ID }}
          path: flutter_app/build/packages/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish selected packages to Releases
    needs: [validate, apk, web, macos, windows]
    if: >-
      ${{ always() && !cancelled() && inputs.publish_release &&
          needs.validate.result == 'success' &&
          (!inputs.build_apk || needs.apk.result == 'success') &&
          (!inputs.build_web || needs.web.result == 'success') &&
          (!inputs.build_macos || needs.macos.result == 'success') &&
          (!inputs.build_windows || needs.windows.result == 'success') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: langpack-*-${{ env.BUILD_ID }}
          merge-multiple: true
          path: release-assets
      - name: Check assets, upload a draft, then publish
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSET_DIR: release-assets
        run: node scripts/manual-packages.mjs publish
