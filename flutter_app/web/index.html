<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F5F8F4">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="LangPack 多语言翻译与语言包导出工作台">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LangPack">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>译包 LangPack</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,body { margin:0; width:100%; height:100%; background:#F5F8F4; }
    #langpack-boot { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:#243E34; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
    #langpack-boot img { width:92px; height:92px; border-radius:23px; margin-bottom:12px; }
    #langpack-boot strong { font-size:28px; font-weight:650; letter-spacing:-1px; }
    #langpack-boot span { font-size:10px; color:#5E7669; letter-spacing:2px; }
  </style>
</head>
<body>
  <div id="langpack-boot" role="status" aria-label="Opening LangPack">
    <img src="icons/Icon-192.png" alt="" width="92" height="92">
    <strong>LangPack</strong><span>WORDS WITHOUT BORDERS</span>
  </div>
  <script>window.addEventListener('flutter-first-frame', function () { document.getElementById('langpack-boot')?.remove(); }, {once:true});</script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
